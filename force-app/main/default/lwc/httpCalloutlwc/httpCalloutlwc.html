<template>
    <lightning-card title="RealTime Currency Rates" icon-name="standard:currency">
        <div class="slds-m-around_medium">
            <lightning-layout multiple-rows="true" vertical-align="end">
                <!-- From Currency Combobox -->
                <lightning-layout-item size="12" small-device-size="4" medium-device-size="2" padding="around-small">
                    <div class="slds-form-element">
                        <div class="slds-form-element__control">
                            <lightning-combobox 
                                name="fromCurrency"
                                label="Select Currency" 
                                value={fromCurrencyValue} 
                                placeholder="Select a currency" 
                                options={currencyOptions} 
                                onchange={handleFromChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </lightning-layout-item>

                <!-- To Currency Combobox -->
                <lightning-layout-item size="12" small-device-size="4" medium-device-size="2" padding="around-small">
                    <div class="slds-form-element">
                        <div class="slds-form-element__control">
                            <lightning-combobox 
                                name="toCurrency"
                                label="To Currency" 
                                value={toCurrencyValue} 
                                placeholder="Select a currency" 
                                options={toCurrencyOptions} 
                                onchange={handleToChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </lightning-layout-item>

                <!-- Action Button -->
                <lightning-layout-item size="12" small-device-size="4" medium-device-size="2" padding="around-small">
                    <lightning-button 
                        variant="brand"
                        label="Conversion Rate" 
                        title="Currency Conversion Rate" 
                        onclick={handleCurrencyConversion}>
                    </lightning-button>
                </lightning-layout-item>
            </lightning-layout>

            <br/><br/>

            <!-- Response Data Layout Display -->
            <template if:true={conversionData}>
                <div class="slds-p-around_medium slds-box slds-theme_shade" id="modal_content-id-1">
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 1rem;">
                        <h1>Exchange Rates Information from <b>{fromCurrencyValue}</b> to <b>{toCurrencyValue}</b></h1>
                    </div>
                    <dl class="slds-list_horizontal slds-wrap">
                        <dt class="slds-item_label slds-text-color_weak slds-truncate" title="From Currency Name">From Currency Name:</dt>
                        <dd class="slds-item_detail slds-truncate"><b>{conversionData.From_Currency_Name}</b></dd>

                        <dt class="slds-item_label slds-text-color_weak slds-truncate" title="From Currency Code">From Currency Code:</dt>
                        <dd class="slds-item_detail slds-truncate"><b>{conversionData.From_Currency_Code}</b></dd>

                        <dt class="slds-item_label slds-text-color_weak slds-truncate" title="To Currency Name">To Currency Name:</dt>
                        <dd class="slds-item_detail slds-truncate"><b>{conversionData.To_Currency_Name}</b></dd>

                        <dt class="slds-item_label slds-text-color_weak slds-truncate" title="To Currency Code">To Currency Code:</dt>
                        <dd class="slds-item_detail slds-truncate"><b>{conversionData.To_Currency_Code}</b></dd>

                        <dt class="slds-item_label slds-text-color_weak slds-truncate" title="Exchange Rate">Exchange Rate:</dt>
                        <dd class="slds-item_detail slds-truncate" style="color: #027e46; font-weight: bold;"><b>{conversionData.Exchange_Rate}</b></dd>

                        <dt class="slds-item_label slds-text-color_weak slds-truncate" title="Last Refreshed">Last Refreshed:</dt>
                        <dd class="slds-item_detail slds-truncate"><b>{conversionData.Last_Refreshed}</b></dd>
                    </dl>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
