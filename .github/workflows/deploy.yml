name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI Locally
        run: npm install sfdx-cli --save-dev

      - name: Authenticate to Salesforce
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > ./sfdx-auth.txt
          npx sfdx force:auth:sfdxurl:store -f ./sfdx-auth.txt -a CICDOrg -d
          rm ./sfdx-auth.txt

      - name: Deploy source and run tests
        run: npx sfdx force:source:deploy -p force-app -u CICDOrg --testlevel RunLocalTests