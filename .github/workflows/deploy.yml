name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        uses: salesforcecli/actions-setup-sfdx@v1

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./sfdx-auth.txt
          sfdx force:auth:sfdxurl:store -f ./sfdx-auth.txt -a CICDOrg -d
          rm ./sfdx-auth.txt

      - name: Deploy source and run tests
        run: sfdx force:source:deploy -p force-app -u CICDOrg --testlevel RunLocalTests --json