name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo ${{ secrets.SF_AUTH_URL }} > ./sfdx-auth-url.txt
          sf org login sfdx-url -f ./sfdx-auth-url.txt --alias CICDOrg --set-default
          rm ./sfdx-auth-url.txt

      - name: Deploy source and run tests
        run: sf project deploy start --source-dir force-app --target-org CICDOrg --test-level RunLocalTests