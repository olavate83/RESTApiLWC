name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install sfdx-cli --global

      - name: Authenticate to Salesforce
        run: |
          echo ${{ secrets.SF_AUTH_URL }} > ./sfdx-auth-url.txt
          sfdx force:auth:sfdxurl:store -f ./sfdx-auth-url.txt -a CICDOrg -d
          rm ./sfdx-auth-url.txt

      - name: Deploy source and run tests
        run: sfdx force:source:deploy -p force-app --testlevel RunLocalTests --json