name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Salesforce CLI Standalone
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir -p ~/sfdx && tar xJf sf-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          sf --version

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./sfdx-auth.txt
          sf org login sfdx-url -f ./sfdx-auth.txt --alias CICDOrg --set-default
          rm ./sfdx-auth.txt

      - name: Deploy source and run tests
        run: sf project deploy start --source-dir force-app --target-org CICDOrg --test-level RunLocalTests